[package]
name = "open-fuel-prices"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
env_logger = "0.11.11"
flate2 = "1.1.11"
log = "0.4.35"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["gzip", "json", "native-tls"] }
